[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.pdo",
    "php83Extensions.pdo_pgsql",
    "php83Extensions.pgsql",
    "php83Extensions.mbstring",
    "php83Extensions.curl",
    "php83Extensions.openssl"
]

[phases.build]
cmds = [
    "mkdir -p storage",
    "chmod -R 777 storage"
]

[start]
cmd = "php -S 0.0.0.0:$PORT index.php"
